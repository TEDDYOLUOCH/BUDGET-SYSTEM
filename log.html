<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Budget System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="login-container">
        <form id="loginForm">
            <h2>Login</h2>
            <div class="form-group">
                <input type="text" id="username" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Enter Password" maxlength="8" required>
            </div>
            <div class="form-group">
                <input class="submit" type="submit" value="Login">
            </div>
        </form>
    </section>
<script>
    // Handle form submission
    document.getElementById('loginForm').addEventListener('submit', function (event) {
        event.preventDefault(); // Prevent default form submission
    
        // Get user input
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
    
        // Authentication logic
        if (username === 'admin' && password === 'admin123') {
            localStorage.setItem('role', 'admin');
            alert('Welcome Admin!');
            window.location.href = 'admin.html'; // Corrected path for admin
        } else if (username === 'user' && password === 'user123') {
            localStorage.setItem('role', 'user');
            alert('Welcome User!');
            window.location.href = 'user.html'; // Corrected path for user
        } else {
            alert('Invalid credentials. Please try again.');
        }
    });
</script>    
</body>
</html>
