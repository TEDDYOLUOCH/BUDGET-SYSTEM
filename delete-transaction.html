<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wise Wallet$ - Add Transaction</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Wise Wallet$ Budget System</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="add-transaction.html">Add Transaction</a>
            <a href="view-budget.html">View Budget</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Add Transaction</h2>
            <form id="transactionForm">
                <label for="description">Description:</label>
                <input type="text" id="description" required>
        
                <label for="amount">Amount:</label>
                <input type="number" id="amount" required>
        
                <label for="type">Type:</label>
                <select id="type" required>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
        
                <button type="button" onclick="addTransaction()">Add Transaction</button>
                <button type="button" onclick="deleteTransaction()">Delete Transaction</button>
            </form>
        </section>
        
    </main>

    <!-- Link to JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
